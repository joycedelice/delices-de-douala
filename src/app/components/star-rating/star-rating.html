<div class="star-container" (mouseleave)="onMouseLeave()">
  @for (star of stars; track star) {
    <span 
      class="star"
      [class.active]="star <= (hoverRating() || currentRating())"
      (mouseenter)="onMouseEnter(star)"
      (click)="selectRating(star)">
      ★
    </span>
    
  }

  
 
</div>
