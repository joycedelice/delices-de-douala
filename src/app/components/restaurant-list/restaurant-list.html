<h2 class="section-title">
  Nos <span class="accent">Meilleurs</span> Restaurants
</h2>
<p class="section-subtitle">Découvrez et partagez vos expériences culinaires</p>

<div class="grid">
  @if (restaurants().length === 0) {
    <p class="empty">Aucun restaurant disponible pour le moment.</p>
  } @else {
   <!-- restaurant-list.html -->
<div class="restaurant-grid">
  @for (resto of restaurants(); track resto.id) {
    <app-restaurant-card 
      [restaurant]="resto" 
      (ratingChanged)="onCardRated($event)" 
    />
  }
</div>
  }
</div>
