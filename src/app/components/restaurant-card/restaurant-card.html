<div class="card">
  @if (restaurant().imageUrl) {
    <img class="card-img" [src]="restaurant().imageUrl" [alt]="restaurant().name" />
  }

  <h3 class="card-title">{{ restaurant().name }}</h3>

  <div class="lieu">
    <svg class="pin-icon" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
    </svg>
    <span class="district">{{ restaurant().district }}</span>
  </div>

  <p class="specialty">
    <span class="label">Spécialité :</span> {{ restaurant().specialty }}
  </p>

  <div class="rating-container">
    <app-star-rating
      [currentRating]="restaurant().currentRating"
      (ratingChanged)="onRatingChanged($event)"
    />

    <p class="rating-label" [class.is-empty]="restaurant().currentRating === 0">
      @if (restaurant().currentRating > 0) {
        ({{ restaurant().currentRating }}/5)
      } @else {
        Cliquez !
      }
    </p>
  </div>
</div>
