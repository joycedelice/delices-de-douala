<div class="detail-container">
  <a routerLink="/" class="back-link">← Retour à la carte</a>

  @if (platsResource.isLoading()) {
    <p class="status">Chargement du plat...</p>
  } @else if (plat(); as p) {
    <article class="detail-card">
      <img [src]="p.image" [alt]="p.nom" class="detail-image" />
      <div class="detail-content">
        <h1>{{ p.nom }}</h1>
        <p class="prix">{{ p.prix | currency:'XAF':'symbol':'1.0-0' }}</p>
        <p class="description">{{ p.description }}</p>
      </div>
    </article>
  } @else {
    <p class="status error">Aucun plat trouvé pour « {{ slug() }} ».</p>
  }
</div>
