<div class="form-container">
  <div class="form-header">
    <h2>Connexion</h2>
    <p>Accédez à votre espace client</p>
  </div>

  <form (ngSubmit)="seConnecter()">
    <div class="form-group">
      <input
        type="email"
        class="form-control"
        name="email"
        placeholder="Adresse email"
        [(ngModel)]="user.email"
        required
      />
    </div>

    <div class="form-group">
      <input
        type="password"
        class="form-control"
        name="password"
        placeholder="Mot de passe"
        [(ngModel)]="user.password"
        required
      />
    </div>

    <button type="submit" class="btn-submit" [disabled]="!user.email || !user.password">
      Se connecter
    </button>
  </form>
</div>
